# =========================================================
# QFlow Production Configuration
# =========================================================

spring.application.name=queue-service


# =========================================================
# Database - Railway MySQL
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}


# =========================================================
# Server
# =========================================================

server.port=${PORT:8081}


# =========================================================
# Redis - Render Key Value
# =========================================================

spring.data.redis.host=${REDIS_HOST}

spring.data.redis.port=${REDIS_PORT:6379}


# =========================================================
# Kafka - Confluent Cloud
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


# =========================================================
# Kafka Producer
# =========================================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# =========================================================
# Kafka Consumer
# =========================================================

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:qflow-test-group}

spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# =========================================================
# Confluent Cloud Security
# =========================================================

spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}

spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";


# =========================================================
# JWT
# =========================================================

qflow.jwt.secret=${JWT_SECRET}